<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingsbloom Chapter One</title>
<meta name="description" content="Playable narrative prototype of Kingsbloom's first chapter: days, people, choices, and a kingdom that remembers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">
<style>/* Kingsbloom Chapter 1 prototype · "Royal Storybook" UI (docs/08 §12): navy panels, parchment pages, gold trim.
   One fixed look in every theme, so every colour is set here. */
:root {
  --bg: #121A2C; --bar: #19223A; --panel: #1D2742; --panel-2: #25325A; --line: #34466F;
  --text: #ECE3CD; --muted: #A7B0C5;
  --gold: #D9A03A; --gold-l: #F2CE78; --seal: #A33A3A; --veil: #8E78F0; --teal: #3FD6C6; --leaf: #5E8F4E;
  --parch: #F4E7C8; --parch-2: #EADBB5; --parch-line: #D5C195; --ink: #2B2219; --ink-soft: #6A5A45;
  --display: "Cinzel", "Cormorant SC", Georgia, serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(120% 60% at 50% 0%, #1C2744 0%, var(--bg) 60%) fixed, var(--bg); color: var(--text); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--gold-l); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.row.top { margin-top: 10px; }
.pad { padding: 16px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font-weight: 800; cursor: pointer; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #E9B54E, #C98B24); border-color: #8A5A1E; color: #2B1C0C; box-shadow: 0 2px 0 #7A4E16; }
.btn.gold:hover:not(:disabled) { border-color: #F7DD9A; filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.page .btn.ghost { color: var(--ink); border-color: #CDB483; }
.page.dark .btn.ghost { color: var(--text); border-color: var(--line); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13.5px; border-radius: 8px; }
.btn small { display: block; font-weight: 600; font-size: 12.5px; color: var(--muted); }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 10px 16px;
  background: var(--bar); border-bottom: 2px solid var(--gold); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--text); cursor: pointer; padding: 0; text-align: left; }
.brand svg { width: 38px; height: 38px; }
.brand b { display: block; font: 700 19px/1 var(--display); letter-spacing: .05em; }
.brand small { font-size: 12px; color: var(--muted); font-weight: 700; }
.clock { display: flex; align-items: baseline; gap: 8px; }
.clock b { font: 700 16px/1 var(--display); color: var(--gold-l); letter-spacing: .04em; }
.clock span { font-size: 14px; color: var(--muted); font-weight: 700; }
.pips { display: inline-flex; gap: 4px; margin-left: 4px; align-self: center; }
.pip { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.pip.past { background: #6D7C9F; }
.pip.on { background: var(--gold-l); box-shadow: 0 0 0 2px rgba(242, 206, 120, .3); }
.meters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-left: auto; }
.meter, .stat { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.meter span, .stat span { color: var(--muted); font-weight: 700; }
.meter i { width: 90px; height: 10px; border-radius: 99px; background: #0E1424; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; display: block; }
.meter i b { display: block; height: 100%; background: linear-gradient(180deg, #C2E488, #6FA864); border-radius: inherit; }
.meter em, .stat b { font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
.stat small { color: var(--muted); font-weight: 700; }
.stat.veil b { color: #C9BCFF; }
.stat.rank b { font-family: var(--display); color: var(--gold-l); }
.menu-btn { margin-left: 0; }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; max-width: 1260px; margin: 0 auto; padding: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* The page (stage) */
.page { background: var(--parch); color: var(--ink); border-radius: 14px; border: 1px solid var(--parch-line); box-shadow: 0 1px 0 #FFF7E2 inset, 0 12px 30px rgba(0, 0, 0, .35);
  padding: 22px clamp(16px, 3vw, 30px) 24px; min-height: 520px; position: relative; }
.page.bg-dawn { background: linear-gradient(180deg, #F8E0CC 0%, var(--parch) 42%); }
.page.bg-dusk { background: linear-gradient(180deg, #F1CFB6 0%, #F2E1C6 48%); }
.page.bg-feast { background: linear-gradient(180deg, #F5D49C 0%, var(--parch) 55%); }
.page.bg-festival { background: linear-gradient(180deg, #F7D8DF 0%, var(--parch) 55%); }
.page.dark { background: radial-gradient(120% 70% at 50% 0%, #283862 0%, #151D33 70%); color: var(--text); border-color: var(--line); box-shadow: 0 12px 30px rgba(0, 0, 0, .45); }
.page.bg-cellar.dark { background: radial-gradient(120% 70% at 50% 0%, #2C2A55 0%, #0F1520 70%); }
.page h2 { font: 700 clamp(24px, 3vw, 30px)/1.15 var(--display); letter-spacing: .03em; margin: 0; text-wrap: balance; }
.page h3 { font: 800 13px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #7C5E37; margin: 22px 0 10px; }
.page.dark h3 { color: var(--gold-l); }

/* Scene */
.scene-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; border-bottom: 1px solid var(--parch-line); padding-bottom: 10px; margin-bottom: 16px; }
.page.dark .scene-head { border-color: var(--line); }
.place { font: 700 18px/1.2 var(--display); letter-spacing: .05em; }
.when { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.page.dark .when { color: var(--muted); }
.lines { max-width: 68ch; }
.line { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 12px; }
.line p { margin: 0; }
.line.enter { animation: rise .32s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.line.narr p { color: #4A3D2E; }
.page.dark .line.narr p { color: #D6CDB8; }
.por { flex: none; width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 40% 35%, #FFF6DD, #E6D3A6); border: 2px solid var(--c, var(--gold)); display: grid; place-items: center; }
.por svg { width: 100%; height: 100%; display: block; }
.por.mono { font: 700 20px/1 var(--display); color: #fff; background: var(--c); border-color: rgba(255, 255, 255, .5); }
.por.sm { width: 34px; height: 34px; font-size: 15px; }
.bubble { background: rgba(255, 252, 243, .7); border: 1px solid var(--parch-line); border-radius: 4px 14px 14px 14px; padding: 8px 13px 9px; }
.page.dark .bubble { background: rgba(20, 28, 50, .72); border-color: var(--line); }
.who { display: flex; align-items: center; gap: 6px; font: 700 14px/1.3 var(--display); letter-spacing: .04em; color: color-mix(in srgb, var(--c, #5A4630) 72%, #1F170F); margin-bottom: 2px; }
.page.dark .who { color: color-mix(in srgb, var(--c, #F2CE78) 55%, #FFFFFF); }
.emote { color: #D9687A; }
.line.you { justify-content: flex-end; }
.line.you .bubble { background: #25325A; color: var(--text); border-color: #33446E; border-radius: 14px 4px 14px 14px; }
.line.you .who { color: var(--gold-l); }
.line.picked p { font-weight: 800; color: #6A4E2E; }
.line.picked p::before { content: "▸ "; color: var(--gold); }
.page.dark .line.picked p { color: var(--gold-l); }
.line.note { display: block; background: #FBF3DF; border: 1px dashed #B99A64; border-left: 4px solid #8A6A3E; border-radius: 8px; padding: 12px 14px; color: #3E3122; font-style: italic; }
.line.memory { display: block; text-align: center; padding: 14px 8px; }
.line.memory p { font: 600 18px/1.5 var(--display); color: #FFE7A6; text-shadow: 0 0 18px rgba(255, 201, 74, .65); letter-spacing: .02em; }
.line.hymn { display: block; text-align: center; }
.line.hymn p { font-style: italic; font-weight: 700; color: #6B4FD8; letter-spacing: .04em; }
.page.dark .line.hymn p { color: #BBAAFF; }
.line.card-vs { display: block; background: #25325A; color: var(--text); border: 2px solid var(--gold); border-radius: 12px; padding: 14px 16px; }
.line.card-vs b { font: 700 18px/1.3 var(--display); color: var(--gold-l); }
.line.card-vs p { margin-top: 6px; color: #D8D2C0; }
.tone { display: inline-block; font: 800 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 6px; background: #3E4E7A; color: #fff; margin-right: 8px; vertical-align: 2px; }
.who .tone { margin: 0 0 0 6px; }
.answer { max-width: 68ch; margin-top: 18px; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; align-items: flex-start; gap: 10px; text-align: left; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #CDB483;
  background: #FBF4E2; color: var(--ink); cursor: pointer; font-weight: 700; line-height: 1.4; }
.choice:hover { border-color: var(--gold); background: #FFF8E8; }
.page.dark .choice { background: #1F2A47; color: var(--text); border-color: #3A4C78; }
.page.dark .choice:hover { border-color: var(--gold-l); }
.choice .key { flex: none; width: 22px; height: 22px; border-radius: 6px; background: #E6D4A8; color: #5A4630; display: grid; place-items: center; font: 700 12px/1 var(--mono); margin-top: 1px; }
.page.dark .choice .key { background: #33446E; color: var(--gold-l); }
.continue { margin-top: 4px; }
.input-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.input-row label { font-weight: 800; }
.input-row input { flex: 1 1 200px; min-height: 42px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid #CDB483; background: #FFFBF0; color: var(--ink); }
.page.dark .input-row input { background: #0F1628; color: var(--text); border-color: var(--line); }

/* Banner designer */
.banner-designer { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 16px; align-items: start; background: #FBF3DF; border: 1px solid var(--parch-line); border-radius: 12px; padding: 14px; }
.bd-controls { display: grid; gap: 10px; }
.bd-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bd-label { width: 64px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #7C5E37; }
.bd-group .sw { width: 32px; height: 32px; border-radius: 8px; background: var(--c); border: 2px solid rgba(0, 0, 0, .15); cursor: pointer; }
.bd-group .em { min-height: 32px; padding: 4px 10px; border-radius: 8px; border: 1.5px solid #CDB483; background: #fff; color: var(--ink); cursor: pointer; font-weight: 700; text-transform: capitalize; }
.bd-group [aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 1px; }
.bd-preview svg { width: 100%; height: auto; }
@media (max-width: 560px) { .banner-designer { grid-template-columns: minmax(0, 1fr); } .bd-preview { max-width: 110px; } }

/* Planner */
.plan-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.plan-head p { margin: 6px 0 0; color: var(--ink-soft); font-weight: 600; }
.recent { margin-top: 16px; background: #FBF3DF; border: 1px solid var(--parch-line); border-radius: 10px; padding: 10px 14px; }
.recent b { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #7C5E37; }
.recent ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; font-weight: 700; color: #4A3D2E; }
.recent .k-warn { color: var(--seal); }
.groups { display: grid; gap: 4px; }
.grp h3 { margin-top: 18px; }
.acts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.act { display: grid; gap: 3px; align-content: start; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #CDB483; background: #FBF4E2; color: var(--ink); cursor: pointer; min-height: 86px; }
.act:hover:not(:disabled) { border-color: var(--gold); background: #FFF8E8; transform: translateY(-1px); }
.act:disabled { opacity: .55; cursor: not-allowed; }
.act .t { font-weight: 800; font-size: 15.5px; }
.act .d { font-size: 13.5px; color: var(--ink-soft); }
.act .e { justify-self: start; margin-top: 4px; font: 600 11.5px/1 var(--mono); color: #3E5A34; background: #E3EDCF; padding: 4px 6px; border-radius: 6px; }
.tip { margin: 20px 0 0; font-size: 13.5px; color: var(--ink-soft); }

/* Shop */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 8px 20px; }
.ledger { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ledger li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: #FBF3DF; border: 1px solid var(--parch-line); font-weight: 700; }
.ledger em { font-style: normal; font-family: var(--mono); font-size: 13px; color: #6A4E2E; }
.ledger small { color: var(--ink-soft); }
.shop .row.end { margin-top: 18px; }
.gift { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.gift select { min-height: 32px; border-radius: 8px; border: 1px solid var(--line); background: #0F1628; color: var(--text); padding: 4px 8px; max-width: 170px; }
.shop .gift select { background: #FFFBF0; color: var(--ink); border-color: #CDB483; }
.gift small { color: var(--muted); font-weight: 700; }
.shop .gift small { color: var(--ink-soft); }

/* Title and end */
.title { display: grid; justify-items: center; text-align: center; gap: 6px; }
.title-mark { width: 120px; height: 120px; }
.title h1 { font: 700 clamp(40px, 7vw, 64px)/1 var(--display); letter-spacing: .04em; margin: 4px 0 0; }
.title .sub { margin: 0; font: 700 16px/1.3 var(--display); color: #7C5E37; letter-spacing: .06em; }
.title .lede { max-width: 56ch; margin: 10px 0 14px; color: #4A3D2E; }
.title .row { justify-content: center; }
.skip { margin-top: 12px; display: grid; gap: 8px; justify-items: center; }
.skip b { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #7C5E37; }
.skip .btn.ghost { color: var(--ink); border-color: #CDB483; }
.title .btn.ghost { color: var(--ink); border-color: #CDB483; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px 24px; text-align: left; margin-top: 14px; width: 100%; }
.two ul { margin: 0; padding-left: 18px; color: #4A3D2E; display: grid; gap: 6px; font-size: 15px; }
.fine { font-size: 13px; color: var(--ink-soft); max-width: 60ch; margin-top: 14px; }
.end .eyebrow { margin: 0; font-size: 12.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #7C5E37; }
.end h2 { margin-top: 6px; }
.end-banner { float: right; width: 90px; margin: 0 0 10px 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 24px; margin: 16px 0 0; }
.facts div, .kv div { display: grid; }
.facts dt, .kv dt { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #7C5E37; }
.facts dd { margin: 0; font: 700 24px/1.2 var(--display); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px 20px; margin: 0; }
.kv dd { margin: 0; font-weight: 700; }
.people-end { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.people-end li { display: flex; align-items: center; gap: 8px; }

/* Side panel */
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: sticky; top: 76px; }
@media (max-width: 980px) { .side { position: static; } }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; background: var(--bar); border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; padding: 12px 8px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 800; font-size: 13.5px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--gold-l); border-bottom-color: var(--gold); }
.panel { max-height: calc(100vh - 150px); overflow-y: auto; }
@media (max-width: 980px) { .panel { max-height: none; } }
.panel h3 { margin: 0 0 8px; font: 700 18px/1.2 var(--display); letter-spacing: .04em; color: var(--text); }
.panel h3 small { font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold-l); margin-left: 6px; }
.panel h4 { margin: 18px 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-l); }
.panel p { margin: 4px 0; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.card.busy { border-color: var(--gold); }
.checks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.checks li { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.checks li::before { content: "○"; margin-right: 8px; color: var(--muted); }
.checks li.ok { color: var(--text); }
.checks li.ok::before { content: "●"; color: var(--teal); }
.checks li span { flex: 1; }
.checks em { font-style: normal; font-family: var(--mono); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.statbox { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 1px; }
.statbox span { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.statbox b { font: 700 18px/1.2 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
.statbox small { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; background: #0F1628; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; margin-top: 6px; }
.seg button { border: 0; border-radius: 8px; padding: 6px 14px; background: none; color: var(--muted); font-weight: 800; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--gold-l); }
.builds, .settlers, .bag, .quests, .people, .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.builds li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.builds p { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.builds .cost { color: #D8CBA8; font-family: var(--mono); font-size: 12px; }
.builds .btn { flex: none; max-width: 150px; text-align: center; }
.settlers li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.settlers span { color: var(--muted); text-align: right; }
.bag li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.bag li .row, .bag li > .btn { grid-column: 1 / -1; }
.bag em { font-style: normal; font-family: var(--mono); font-size: 12.5px; color: #D8CBA8; }
.quests li { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.qid { display: inline-block; font: 600 11px/1 var(--mono); background: #0F1628; color: var(--gold-l); padding: 4px 6px; border-radius: 6px; margin-right: 8px; vertical-align: 2px; }
.qid.ask { color: #F4B6C0; }
.quests b { font-weight: 800; }
.quests p { color: #D6CDB8; font-size: 14px; margin-top: 6px; }
.people li { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.ph { display: flex; gap: 10px; align-items: center; }
.ph b { display: block; font: 700 15px/1.2 var(--display); letter-spacing: .03em; }
.role { display: block; font-size: 12.5px; color: var(--muted); }
.purpose { font-size: 13.5px; color: #D6CDB8; }
.hearts { display: inline-flex; gap: 3px; margin-top: 4px; }
.hearts i { width: 11px; height: 10px; display: block; background: #3A4468; clip-path: path("M5.5 10 1 5.6a2.6 2.6 0 0 1 4.5-3.3 2.6 2.6 0 0 1 4.5 3.3Z"); }
.hearts i.on { background: #F07C8C; }
.log li { font-size: 13.5px; color: #D6CDB8; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; }
.log li span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.log .k-story, .log .k-unlock { color: var(--gold-l); }
.log .k-warn { color: #F4A3A3; }
.log .k-day { color: var(--muted); font-style: italic; }
.flags { margin: 0; display: grid; gap: 2px; }
.flags div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font: 500 12px/1.5 var(--mono); padding: 2px 6px; border-radius: 4px; }
.flags dt { color: var(--muted); overflow-wrap: anywhere; }
.flags dd { margin: 0; color: var(--text); text-align: right; overflow-wrap: anywhere; }
.flags .changed { background: rgba(242, 206, 120, .16); }
.flags .changed dt, .flags .changed dd { color: var(--gold-l); }

/* Toasts and menu */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--parch); color: var(--ink); border-radius: 10px; border-left: 5px solid var(--gold); padding: 10px 14px; font-weight: 700; font-size: 14.5px; box-shadow: 0 10px 24px rgba(0, 0, 0, .35); animation: rise .25s ease both; transition: opacity .5s; }
.toast.out { opacity: 0; }
.toast.k-heart { border-left-color: #F07C8C; }
.toast.k-warn { border-left-color: var(--seal); }
.toast.k-unlock, .toast.k-build { border-left-color: var(--teal); }
.toast.k-people { border-left-color: var(--leaf); }
.overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(8, 12, 22, .72); padding: 16px; }
.overlay.open { display: grid; }
.sheet { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
.sheet h2 { margin: 0 0 14px; font: 700 22px/1.2 var(--display); letter-spacing: .04em; }
.col { display: grid; gap: 8px; }
.col .btn { justify-content: flex-start; flex-direction: column; align-items: flex-start; text-align: left; }

@media (prefers-reduced-motion: reduce) { .line.enter, .toast { animation: none; } .act:hover:not(:disabled) { transform: none; } }
@media (max-width: 640px) {
  .bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; padding: 8px 12px; gap: 6px 12px; }
  .brand span { display: none; }
  .brand svg { width: 32px; height: 32px; }
  .clock { flex-wrap: wrap; gap: 2px 8px; }
  .menu-btn { grid-column: 3; grid-row: 1; }
  .meters { grid-column: 1 / -1; margin-left: 0; justify-content: space-between; gap: 4px 12px; }
  .meter i { width: 60px; }
  .toast { font-size: 13.5px; padding: 8px 12px; }
  .toast:nth-last-child(n+3) { display: none; }
  .layout { padding: 12px; }
  .page { min-height: 0; }
}
</style>
</head>
