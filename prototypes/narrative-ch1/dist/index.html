ence, your very small light in the dark. ","#","^speaker:flicker","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["\n","^Where am I? ","#","^speaker:you","/#","\n","^Excellent question. Terrible answer: I'm not entirely sure. I'm Flicker, though, and I'm here too, so that's something. ","#","^speaker:flicker","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["\n","^Is that… a crown? ","#","^speaker:you","/#","\n","^It's a very small crown for a very important flame. I'm Flicker. Keep up. ","#","^speaker:flicker ","/#","#","^mood:smug","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^You look different. Younger. Muddier. Do you remember your name? ","#","^speaker:flicker ","/#","#","^mood:squint","/#","\n","^Type your name. ","#","^input:var_player_name","/#","\n","ev",{"VAR?":"var_player_name"},"out","/ev","^. Yes. That sounds right. It tastes right, too. Like toast. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","^And when people bowed to you, what did they call you? ","#","^speaker:flicker","/#","\n","ev","str","^King","/str","/ev",{"*":".^.c-3","flg":20},"ev","str","^Queen","/str","/ev",{"*":".^.c-4","flg":20},"ev","str","^Monarch","/str","/ev",{"*":".^.c-5","flg":20},{"c-3":["\n","ev","str","^King","/str","/ev",{"VAR=":"var_title","re":true},{"->":".^.^.^.g-1"},{"#f":5}],"c-4":["\n","ev","str","^Queen","/str","/ev",{"VAR=":"var_title","re":true},{"->":".^.^.^.g-1"},{"#f":5}],"c-5":["\n","ev","str","^Monarch","/str","/ev",{"VAR=":"var_title","re":true},{"->":".^.^.^.g-1"},{"#f":5}]}],"g-1":["ev",{"VAR?":"var_title"},"out","/ev","^ ","ev",{"VAR?":"var_player_name"},"out","/ev","^. It suits you. Well. It suited you. We'll get there. ","#","^speaker:flicker","/#","\n","^Behind you stands a stone throne, split down the middle and furred with moss. Ash sits in every crack.","\n","^That's the Ashen Throne. Yours, I think. You were sitting on it for… a while. ","#","^speaker:flicker","/#","\n",["ev",{"^->":"mq101_waking.0.g-1.21.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-6","flg":18},{"s":["^Then I have a kingdom to find. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq101_waking.0.g-1.22.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-7","flg":18},{"s":["^At least I woke up to a friendly face. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq101_waking.0.g-1.23.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-8","flg":18},{"s":["^Comfortable. Five stars. Would wake up in the mud again. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-6":["ev",{"^->":"mq101_waking.0.g-1.c-6.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.21.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n","^Ooh. Chin up and everything. I missed that. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n",{"->":".^.^.^.g-2"},{"#f":5}],"c-7":["ev",{"^->":"mq101_waking.0.g-1.c-7.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.22.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n","^I'm a face! You think I'm a face! ","#","^speaker:flicker ","/#","#","^mood:happy ","/#","#","^emote:heart","/#","\n",{"->":".^.^.^.g-2"},{"#f":5}],"c-8":["ev",{"^->":"mq101_waking.0.g-1.c-8.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.23.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n","^Ha! The mud's free, at least. Everything else costs. ","#","^speaker:flicker","/#","\n",{"->":".^.^.^.g-2"},{"#f":5}]}],"g-2":["^Down the slope, a still pond catches the grey sky. In it, a stranger looks back at you: about twenty, tired eyes, a coat that used to be royal.","\n","^Past the pond, the world disappears into a violet mist that glitters teal at the edges.","\n","^See that? That's the Veil. Pretty by day. At night it gets… bitey. ","#","^speaker:flicker ","/#","#","^mood:worried","/#","\n","^We need a fire before dark. Ten wood and five stone. You remember sticks? Pointy, woody, very popular. ","#","^speaker:flicker","/#","\n","ev",true,"/ev",{"VAR=":"ch1_woke","re":true},"ev","str","^activity:gather","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","ev","str","^recipe:sig_twine","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null]}],null],"mq101_campfire":["^You ring the stones at the foot of the throne and stack the sticks inside. ","#","^scene:The Ashen Throne ","/#","#","^bg:day","/#","\n","^Allow me. ","#","^speaker:flicker ","/#","#","^mood:smug","/#","\n","^Flicker dives in. For a moment nothing happens. Then the sticks catch with a soft whump, and warmth hits your face.","\n","^Ahhh. That's the stuff. I haven't been properly warm in… a long time. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","ev","str","^mat_wood","/str",-10,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^min_stone","/str",-5,{"x()":"give","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"ch1_campfire","re":true},"ev","str","^activity:cook","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^Now we can cook, too. Cooking is free. Eating is free. I love free. ","#","^speaker:flicker","/#","\n","done",null],"mq102_first_night":[[["ev",{"VAR?":"ch1_campfire"},"!","/ev",{"->":".^.b","c":true},{"b":["\n","^The light is going. You scrape together every stick in reach, and Flicker lights them with a squeak of panic. ","#","^scene:The Ashen Throne ","/#","#","^bg:night","/#","\n","ev",true,"/ev",{"VAR=":"ch1_campfire","re":true},"ev","str","^activity:cook","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n",{"->":".^.^.^.2"},null]}],[{"->":".^.b"},{"b":["\n","^The sun drops behind the hills, and the Veil comes down the valley like a slow violet tide. ","#","^scene:The Ashen Throne ","/#","#","^bg:night","/#","\n",{"->":".^.^.^.2"},null]}],"nop","\n","^Beyond the firelight, the mist glitters teal. Something moves in it. Several somethings.","\n","^Duskwolves. They don't like light. Stay in the light. That's the whole plan. ","#","^speaker:flicker ","/#","#","^mood:worried","/#","\n","ev",0,"/ev",{"temp=":"fed"},[["ev",{"VAR?":"fed"},0,"==","/ev",{"->":".^.b","c":true},{"b":["\n","^The fire is already burning low.","\n",{"->":".^.^.^.3"},null]}],["ev",{"VAR?":"fed"},1,"==","/ev",{"->":".^.b","c":true},{"b":["\n","^The wolves circle closer. Two pairs of eyes. Then five.","\n",{"->":".^.^.^.3"},null]}],[{"->":".^.b"},{"b":["\n","^Hours pass. The wolves are patient.","\n",{"->":".^.^.^.3"},null]}],"nop","\n","ev","str","^Feed the fire with a stick.","/str","str","^mat_wood","/str",{"x()":"item","exArgs":1},0,">","/ev",{"*":".^.c-0","flg":5},"ev","str","^Break a branch off the dead tree beside the throne.","/str","/ev",{"*":".^.c-1","flg":4},"ev","str","^Step into the dark for more sticks.","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev","str","^mat_wood","/str",-1,{"x()":"give","exArgs":2},"pop","/ev","\n","^The flames jump. The eyes in the mist blink and back away.","\n",{"->":".^.^.^.g-0"},null],"c-1":["\n","^The branch cracks like a whip. The wolves flinch. So does Flicker.","\n",{"->":".^.^.^.g-0"},null],"c-2":["\n","ev","str","^exposure","/str",25,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","^Three steps past the light, the cold gets inside your coat. Whispers brush your ears in no language you know. You grab an armful of sticks and run back.","\n","^What did I say? What did I literally just say? ","#","^speaker:flicker ","/#","#","^mood:angry","/#","\n","^That cold is Exposure. Out in the Veil it builds up in you. Light and fire burn it off. ","#","^speaker:flicker","/#","\n",{"->":".^.^.^.g-0"},{"#f":5}],"#n":"watch"}],{"g-0":["ev",{"VAR?":"fed"},1,"+",{"temp=":"fed","re":true},"/ev","ev",{"VAR?":"fed"},3,"<","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":".^.^.^.^.watch"},{"->":".^.^.^.12"},null]}],"nop","\n","^Near dawn, one wolf loses patience and lunges. You swing a burning branch. It connects, and the wolf comes apart into mist, like breath on a cold morning.","\n","^They don't die. They just… go back into the Veil. ","#","^speaker:flicker","/#","\n","^Grey light. Birdsong. The Veil pulls back up the valley. ","#","^bg:dawn","/#","\n","^We did it! Night one! I'm so proud of us. Mostly me. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","^Flicker sinks into the embers. The whole fire turns gold and rises into a steady, living flame.","\n","^This is the Heartflame. Well, a piece of it. Everything its light touches is safe. That's your Realm, Majesty. Small. Cute. A starter kingdom. ","#","^speaker:flicker ","/#","#","^mood:proud","/#","\n","ev","str","^exposure","/str",-100,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^beacon","/str",1,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"ch1_survived_night1","re":true},"ev","str","^beacon:1","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null]}],null],"mq103_old_fields":[["^Morning. Flicker bobs ahead of you down the hill, towards a patchwork of overgrown fields. ","#","^scene:Old Royal Fields ","/#","#","^bg:day","/#","\n","^Old stone markers stand at the corners, each carved with a sun. Moss has eaten half of them.","\n","^Somebody grew food here for a lot of people, once. ","#","^speaker:flicker","/#","\n","ev","str","^Look closer at the sun carvings.","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Get to work.","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["\n","^The sun has a face, a crown, and twelve rays. You feel sure you've seen it before. You can't think where.","\n","ev",true,"/ev",{"VAR=":"lore_sun_sigil","re":true},{"->":".^.^.g-0"},{"#f":5}],"c-1":["\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^You lash a flat stone to a stick for a hoe and clear six patches of earth.","\n","^In the roots of an old hedge you find a clay jar of wild turnip seeds, still good.","\n","ev","str","^crop_turnip","/str",6,{"x()":"plant","exArgs":2},"pop","/ev","\n","^Turnips! Four days of sun and water, and then… turnips. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","^Water them every day. Or find a friend who likes watering. Just a thought. ","#","^speaker:flicker","/#","\n","ev","str","^activity:fields","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^A bell jingles on the old road. A huge shaggy creature plods out of the mist, hung with pots and lanterns, pulling a painted cart.","\n","^Darling! A customer! In the Veil! Do you know how rare you are? ","#","^speaker:mira ","/#","#","^mood:happy","/#","\n","^I'm Mira. Mira Caravel. This is Humphrey. Don't feed him your fingers. ","#","^speaker:mira","/#","\n","^Humphrey sneezes. Several lanterns rattle.","\n",["ev",{"^->":"mq103_old_fields.0.g-0.51.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^Welcome to my kingdom. Such as it is. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq103_old_fields.0.g-0.52.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-3","flg":18},{"s":["^Nice to meet you, Mira. And Humphrey. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq103_old_fields.0.g-0.53.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-4","flg":18},{"s":["^Are you lost, or is this a very bad road? ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-2":["ev",{"^->":"mq103_old_fields.0.g-0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.51.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n","^Your kingdom! Oh, I love a big dream. Big dreams buy things. ","#","^speaker:mira ","/#","#","^mood:happy","/#","\n",{"->":".^.^.^.g-1"},{"#f":5}],"c-3":["ev",{"^->":"mq103_old_fields.0.g-0.c-3.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.52.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n","^Manners! Out here! Humphrey, remember this face. ","#","^speaker:mira ","/#","#","^mood:happy","/#","\n",{"->":".^.^.^.g-1"},{"#f":5}],"c-4":["ev",{"^->":"mq103_old_fields.0.g-0.c-4.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.53.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n","^Both, darling. Always both. That's where the customers are. ","#","^speaker:mira","/#","\n",{"->":".^.^.^.g-1"},{"#f":5}]}],"g-1":["^She looks at your coat, then at your field, then at your coat again.","\n","^Tell you what. I'll buy whatever you grow or forage, any day I'm passing. And here's a free sample. ","#","^speaker:mira","/#","\n","ev","str","^gold","/str",50,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^seed_carrot","/str",4,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^crop_carrot","/str",1,{"x()":"give","exArgs":2},"pop","/ev","\n","^Fifty coins for your first sale, four carrot seeds, and one carrot. Mossbuns go silly for carrots. Call it an investment in a very muddy future. ","#","^speaker:mira ","/#","#","^mood:wink","/#","\n","^I come through on Tuesdays and Fridays. Bring coin, or bring gossip. ","#","^speaker:mira","/#","\n","ev",true,"/ev",{"VAR=":"npc_mira_met","re":true},"ev","str","^activity:caravan","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"ch1_first_crops","re":true},"^She's lovely. She's also going to take all our money. Both things can be true. ","#","^speaker:flicker","/#","\n","done",null]}],null],"mq105_intro":["^By the fire, Flicker is unusually quiet. Then: ","#","^scene:The Ashen Throne ","/#","#","^bg:dusk","/#","\n","^Did you see them by the river? Little round rabbits with moss on their ears? ","#","^speaker:flicker","/#","\n","^Those are Mossbuns. Veilkin: creatures born where the Veil mixed with the wild. They're not evil. The Veil is just home, for them. ","#","^speaker:flicker","/#","\n","^And you can make Pacts with them. Because you're special. Don't ask me how I know that. I don't know how I know that. ","#","^speaker:flicker ","/#","#","^mood:squint","/#","\n","^Offer a Mossbun a carrot and it might stay. Some creatures want a gift. Some want to be beaten fair and square first. ","#","^speaker:flicker","/#","\n","ev",true,"/ev",{"VAR=":"ch1_meadow_shown","re":true},"ev","str","^location:meadow","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null],"loc_meadow":[["ev",{"VAR?":"ch1_first_pact"},"!","/ev",{"->":".^.b","c":true},{"b":["\n",{"->":".^.^.^.first_pacts"},{"->":".^.^.^.4"},null]}],["ev",{"VAR?":"ch1_emberkit_pact"},"!","str","^sig_twine","/str",{"x()":"item","exArgs":1},0,">","&&","/ev",{"->":".^.b","c":true},{"b":["\n","^Mossbun Meadow. The Emberkit is back, sunning itself on a rock with its tail curled round it like a scarf. ","#","^scene:Mossbun Meadow ","/#","#","^bg:day","/#","\n",{"->":".^.^.^.emberkit"},{"->":".^.^.^.4"},null]}],["ev",{"VAR?":"ch1_vs_complete"},{"VAR?":"npc_juniper_recruited"},"!","&&","/ev",{"->":".^.b","c":true},{"b":["\n",{"->":"sq115_herd"},{"->":".^.^.^.4"},null]}],[{"->":".^.b"},{"b":["\n",{"->":".^.^.^.idle"},{"->":".^.^.^.4"},null]}],"nop","\n",{"first_pacts":[["^Mossbun Meadow is all clover and soft hills. Round shapes with mossy ears freeze as you arrive. ","#","^scene:Mossbun Meadow ","/#","#","^bg:day","/#","\n","ev","str","^crop_carrot","/str",{"x()":"item","exArgs":1},1,"<","/ev",[{"->":".^.b","c":true},{"b":["\n","^The Mossbuns sniff the air, find nothing interesting about you, and hop away.","\n","^You came to a negotiation empty-handed? Carrots, Majesty. Mira sells them. Or grow some. ","#","^speaker:flicker","/#","\n","done",{"->":".^.^.^.17"},null]}],"nop","\n","ev","str","^Kneel and hold out the carrot.","/str","/ev",{"*":".^.c-0","flg":20},{"c-0":["\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^One Mossbun, braver than the rest, hops over. It sniffs the carrot. It sniffs you. Something hums in your chest, low and warm.","\n","ev","str","^crop_carrot","/str",-1,{"x()":"give","exArgs":2},"pop","/ev","\n","^It takes the carrot and leans its whole weight against your knee.","\n","^That's a Pact! An Offering Pact! Look at it, it's already bossing you around. ","#","^speaker:flicker ","/#","#","^mood:happy ","/#","#","^emote:heart","/#","\n","ev","str","^familiars","/str",1,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","^Back at the fields you set up a little Field Post by the turnips. The Mossbun claims it at once and starts nudging the soil with its nose.","\n","^Mossbuns love tending crops. Now your field gets watered even on days you're busy being a ","ev",{"VAR?":"var_title"},"out","/ev","^. ","#","^speaker:flicker","/#","\n","ev",true,"/ev",{"VAR=":"ch1_first_pact","re":true},"ev","str","^familiar:tending","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^The meadow rustles. A small orange fox with an ember for a tail darts out of the clover, steals the carrot top, and sits there chewing it at you.","\n","^An Emberkit! Those don't take gifts. They take you seriously, or not at all. ","#","^speaker:flicker","/#","\n","ev","str","^sig_twine","/str",{"x()":"item","exArgs":1},1,"<","str","^mat_fiber","/str",{"x()":"item","exArgs":1},3,">=","&&","/ev",[{"->":".^.b","c":true},{"b":["\n","^Twist some fiber into a Twine Sigil. Quick! I'll hold your… nothing. I'll watch. ","#","^speaker:flicker","/#","\n","ev","str","^mat_fiber","/str",-3,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^sig_twine","/str",1,{"x()":"give","exArgs":2},"pop","/ev","\n",{"->":".^.^.^.80"},null]}],"nop","\n","ev","str","^sig_twine","/str",{"x()":"item","exArgs":1},1,"<","/ev",[{"->":".^.b","c":true},{"b":["\n","^The Emberkit yips once and vanishes into the grass.","\n","^We'll need a Twine Sigil for that one. Three fiber, twisted with purpose. Come back when you have it. ","#","^speaker:flicker","/#","\n","done",{"->":".^.^.^.91"},null]}],"nop","\n",{"->":".^.^.^.^.emberkit"},null]}],null],"emberkit":[["^The Emberkit circles you, tail blazing.","\n","ev","str","^Dodge its first pounce.","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Stand your ground.","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["\n","^You roll aside. It skids past, surprised and pleased.","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["\n","^It singes your sleeve and bounces off, delighted.","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Now! The sigil! ","#","^speaker:flicker","/#","\n","ev","str","^Wrap the Twine Sigil round your hand and reach for it.","/str","/ev",{"*":".^.c-2","flg":20},{"c-2":["\n",{"->":".^.^.^.g-1"},{"#f":5}]}],"g-1":["^The sigil flares. For a moment you see a thread of light between you and the little fox. It stops. It sits. It sneezes a spark.","\n","ev","str","^sig_twine","/str",-1,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^familiars","/str",1,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^power","/str",1,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"ch1_emberkit_pact","re":true},"^A Subdue Pact. It respects you now. That's the most an Emberkit respects anyone. It'll fight at your side, too. ","#","^speaker:flicker ","/#","#","^mood:proud","/#","\n","done",null]}],null],"idle":["^Mossbun Meadow hums with bees. ",["ev","visit",3,"seq","/ev","ev","du",0,"==","/ev",{"->":".^.s0","c":true},"ev","du",1,"==","/ev",{"->":".^.s1","c":true},"ev","du",2,"==","/ev",{"->":".^.s2","c":true},"nop",{"s0":["pop","^A Mossbun is asleep on its back in the clover.",{"->":".^.^.23"},null],"s1":["pop","^Two Mossbuns are having a slow, serious argument about a dandelion.",{"->":".^.^.23"},null],"s2":["pop","^Your Mossbun's cousins watch you from a respectful distance.",{"->":".^.^.23"},null],"#f":5}],"^ ","#","^scene:Mossbun Meadow ","/#","#","^bg:day","/#","\n","^You gather what the meadow offers.","\n","ev","str","^frg_forage","/str",3,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^mat_fiber","/str",2,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^frg_healing_herb","/str",1,{"x()":"give","exArgs":2},"pop","/ev","\n","done",null]}],"mq104_smoke":["^A thin line of smoke rises in the north-west, where an old windmill leans against the sky. ","#","^scene:Dawnmere Vale ","/#","#","^bg:day","/#","\n","^Smoke means fire. Fire means people. People means… actually, a lot of things. Let's go and look. Carefully. ","#","^speaker:flicker","/#","\n","ev",true,"/ev",{"VAR=":"ch1_smoke_seen","re":true},"ev","str","^location:windmill","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null],"loc_windmill":[[["ev",{"VAR?":"npc_bram_recruited"},"/ev",{"->":".^.b","c":true},{"b":["\n",{"->":".^.^.^.^.after"},{"->":".^.^.^.2"},null]}],["ev",{"VAR?":"npc_bram_found"},"/ev",{"->":".^.b","c":true},{"b":["\n","^The windmill creaks. Bram looks up from his fire. ","#","^scene:Windmill Ruin ","/#","#","^bg:day","/#","\n","^Back again. Did you bring it? ","#","^speaker:bram","/#","\n",{"->":".^.^.^.^.check_items"},{"->":".^.^.^.2"},null]}],"nop","\n","^The Windmill Ruin creaks in the wind. Its sails hang in ribbons. Someone has patched the door with planks from a boat. ","#","^scene:Windmill Ruin ","/#","#","^bg:day","/#","\n","^Inside, by a smoky fire, a big grey-bearded man sits with a bloody bandage round one leg and a hammer in his fist.","\n","^Don't just stand there gawping, kid. Either help or finish robbing me. ","#","^speaker:bram ","/#","#","^mood:grumpy","/#","\n","ev",true,"/ev",{"VAR=":"npc_bram_found","re":true},["ev",{"^->":"loc_windmill.0.26.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^Stand down. I mean you no harm. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"loc_windmill.0.27.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^I'm not here to rob you. I saw your smoke. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"loc_windmill.0.28.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^Rob you of what? The ambience? ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"loc_windmill.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.26.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n","^Stand down. Ha. Haven't heard that in twelve years. ","#","^speaker:bram","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"loc_windmill.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.27.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n","^Then you're the first thing in this valley that isn't. ","#","^speaker:bram","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"loc_windmill.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.28.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n","^Cheeky. Good. Cheeky means you're not a ghost. ","#","^speaker:bram","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Bram. Bram Holloway. A Duskwolf got my leg two nights back. Fever's coming, I can feel it. ","#","^speaker:bram","/#","\n","^A torn coat hangs on a nail. On the shoulder is a faded badge: a compass crossed with a sword.","\n","^Aldmark Dominion. Expedition Corps. I came into this mist with a whole survey team, twelve years ago. I'm what's left. ","#","^speaker:bram","/#","\n","^I need Healing Herbs. Green, little white flowers. Three. And food. Real food, cooked. Can you manage that? ","#","^speaker:bram","/#","\n","^He's proud. He won't ask twice. ","#","^speaker:flicker","/#","\n","ev","str","^quest:bram_herbs","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n",{"->":".^.^.^.check_items"},null]}],{"check_items":[["ev","str","^frg_healing_herb","/str",{"x()":"item","exArgs":1},3,">=","str","^food_any","/str",{"x()":"item","exArgs":1},1,">=","&&","/ev",{"->":".^.b","c":true},{"b":["\n",{"->":".^.^.^.^.recruit"},{"->":".^.^.^.4"},null]}],["ev","str","^frg_healing_herb","/str",{"x()":"item","exArgs":1},3,">=","/ev",{"->":".^.b","c":true},{"b":["\n","^Herbs, good. Now something hot. Cook it at your fire. Anything but mud. ","#","^speaker:bram","/#","\n",{"->":".^.^.^.4"},null]}],["ev","str","^food_any","/str",{"x()":"item","exArgs":1},1,">=","/ev",{"->":".^.b","c":true},{"b":["\n","^Smells good. But this leg needs herbs first. Three. White flowers. ","#","^speaker:bram","/#","\n",{"->":".^.^.^.4"},null]}],[{"->":".^.b"},{"b":["\n","^Three Healing Herbs and one cooked meal. I'll be here. Not like I can go anywhere. ","#","^speaker:bram","/#","\n",{"->":".^.^.^.4"},null]}],"nop","\n","done",null],"recruit":[["^You hand over the herbs and the food. Bram chews the herbs into a paste, packs his wound, and eats like a man who has lived on pride for a week.","\n","ev","str","^frg_healing_herb","/str",-3,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^food_any","/str",-1,{"x()":"give","exArgs":2},"pop","/ev","\n","^That's… that's better. Thank you, kid. ","#","^speaker:bram","/#","\n","^He stares into the fire for a while.","\n","^Twelve years I waited for a ship that wasn't coming. You get good at waiting. You forget how to do anything else. ","#","^speaker:bram","/#","\n",["ev",{"^->":"loc_windmill.recruit.0.32.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^I have a throne, a fire, and a field of turnips. I need a carpenter. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"loc_windmill.recruit.0.33.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^Then stop waiting. Come and build something with me. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"loc_windmill.recruit.0.34.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^I can't pay you. But the view is great, and the flame talks. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"loc_windmill.recruit.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.32.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"loc_windmill.recruit.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.33.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"loc_windmill.recruit.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.34.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n","^I heard that. ","#","^speaker:flicker","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Bram looks at you for a long moment. Then at Flicker. Then at his hammer.","\n","^Measure twice, cut once, complain forever. That's carpentry, kid. ","#","^speaker:bram","/#","\n","^…Might as well build something that stays put. ","#","^speaker:bram ","/#","#","^mood:smile","/#","\n","ev",true,"/ev",{"VAR=":"npc_bram_recruited","re":true},"^He pulls a waterlogged notebook from inside his coat.","\n","^Here. My survey report. Read it if you want to know what this mist does to people. ","#","^speaker:bram","/#","\n","^Dominion Expedition Corps, Survey 7. Day 19. Compass useless. Veilglass readings off every scale. We've lost Harlow and the Keane brothers. The mist sings at night. If anyone reads this: we did not go mad. It really does sing. ","#","^style:note","/#","\n","ev","str","^key_expedition_report","/str",1,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^building:lodge","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","ev","str","^recipe:food_baked_potato","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^A carpenter! Bram can build anything, Majesty. Homes, workshops, and I'm hoping a little shelf for me. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","done",null]}],null],"after":["^The windmill is quiet. Bram's tools have moved to his Lodge by your fire, but his old camp still smells of pipe smoke. ","#","^scene:Windmill Ruin ","/#","#","^bg:day","/#","\n",["ev","visit",3,"seq","/ev","ev","du",0,"==","/ev",{"->":".^.s0","c":true},"ev","du",1,"==","/ev",{"->":".^.s1","c":true},"ev","du",2,"==","/ev",{"->":".^.s2","c":true},"nop",{"s0":["pop","^On the wall, someone has carved a tally of days. It stops somewhere past four thousand.",{"->":".^.^.23"},null],"s1":["pop","^A ship's lantern hangs from a nail. It has been polished, recently and often.",{"->":".^.^.23"},null],"s2":["pop","^Under a loose board you find a little carved wooden bird. You put it back.",{"->":".^.^.23"},null],"#f":5}],"\n","^You pick up a few useful things on the way home.","\n","ev","str","^mat_wood","/str",6,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^frg_healing_herb","/str",1,{"x()":"give","exArgs":2},"pop","/ev","\n","done",null]}],"mq106_lost_healer":[["^Dusk. A bell rings, thin and far away, from the east. Once. Twice. Then too many times, too fast. ","#","^scene:The Ashen Throne ","/#","#","^bg:dusk","/#","\n","^That's the old chapel bell. Someone's out there at dusk. Idiot. Or brave. Usually both. ","#","^speaker:bram","/#","\n","^Majesty, a person is ringing that. A scared one. ","#","^speaker:flicker ","/#","#","^mood:worried","/#","\n","ev","str","^Run for the chapel.","/str","/ev",{"*":".^.c-0","flg":20},{"c-0":["\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^You cross the river on stepping stones as the Veil slides down the valley. ","#","^scene:The Ruined Chapel ","/#","#","^bg:night","/#","\n","^The Ruined Chapel has no roof, only arches and ivy. Inside, a young woman with an ash-blonde braid is feeding a tiny fire with pages torn from a hymnbook.","\n","^Pale shapes circle the chapel in the mist. A deer. A fox. A boar. Their eyes are white and empty.","\n","^Hollowed. Creatures the Hunger got into. Don't let them touch you. ","#","^speaker:flicker ","/#","#","^mood:worried","/#","\n","^Stay back! They're drawn to— oh. You're not one of them. ","#","^speaker:linnea ","/#","#","^mood:scared","/#","\n","^I'm Linnea. I've kept this fire alive since noon. I'm running out of hymns. ","#","^speaker:linnea","/#","\n","ev",0,"/ev",{"temp=":"watch"},["ev",{"VAR?":"watch"},1,"+",{"temp=":"watch","re":true},"/ev",["ev",{"VAR?":"watch"},1,"==","/ev",{"->":".^.b","c":true},{"b":["\n","^The first Hollowed deer steps into the doorway. The fire hisses.","\n",{"->":".^.^.^.9"},null]}],["ev",{"VAR?":"watch"},2,"==","/ev",{"->":".^.b","c":true},{"b":["\n","^Midnight. A boar batters at the broken wall. Linnea's hands are shaking. Her voice isn't.","\n",{"->":".^.^.^.9"},null]}],[{"->":".^.b"},{"b":["\n","^The darkest hour. The mist presses in so thick you can hear it whisper.","\n",{"->":".^.^.^.9"},null]}],"nop","\n","ev","str","^Feed the fire with broken pews.","/str","/ev",{"*":".^.c-1","flg":4},"ev","str","^Guard the doorway.","/str","/ev",{"*":".^.c-2","flg":4},"ev","str","^Help Linnea keep the hurt Mossbun warm.","/str","/ev",{"*":".^.c-3","flg":4},{"c-1":["\n","^You throw on the last splinters of a pew. The light swells and the Hollowed flinch back.","\n",{"->":".^.^.^.^.g-1"},null],"c-2":["\n","^You plant yourself in the arch, stick up. Something white-eyed snaps at you and retreats, hissing mist.","\n","ev","str","^exposure","/str",10,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","^Hold still. Yarrow. It stings, sorry. ","#","^speaker:linnea","/#","\n","^She presses a green poultice to your arm, and the cold drains out of it.","\n",{"->":".^.^.^.^.g-1"},null],"c-3":["\n","^A Mossbun with a torn ear is tucked in her shawl. You hold it close to the fire until it stops shaking.","\n","ev","str","^linnea","/str",30,{"x()":"add_hearts","exArgs":2},"pop","/ev","\n",{"->":".^.^.^.^.g-1"},null],"#n":"defend"}],null],"g-1":["ev",{"VAR?":"watch"},3,"<","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":".^.^.^.^.g-0.defend"},{"->":".^.^.^.6"},null]}],"nop","\n","^Dawn comes all at once, the way it does after a long night. The Veil pulls back, and the Hollowed go with it. ","#","^bg:dawn","/#","\n","^Linnea sits down on the chapel step as if her strings have been cut.","\n","^My village was called Marsh End. The Hollowing came through it in one night. I'm a healer. I couldn't heal any of it. ","#","^speaker:linnea ","/#","#","^mood:sad","/#","\n","^I've been walking ever since. ","#","^speaker:linnea","/#","\n","ev",{"x()":"season"},"str","^Spring","/str","==","str","^season_day","/str",{"x()":"stat","exArgs":1},5,"==","&&","/ev",[{"->":".^.b","c":true},{"b":["\n","^It's my birthday, actually. Today. I didn't think I'd see it. ","#","^speaker:linnea ","/#","#","^mood:smile","/#","\n","ev",true,"/ev",{"VAR=":"deed_saved_linnea_on_birthday","re":true},"ev","str","^linnea","/str",100,{"x()":"add_hearts","exArgs":2},"pop","/ev","\n",{"->":".^.^.^.43"},null]}],"nop","\n",["ev",{"^->":"mq106_lost_healer.0.g-1.45.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-4","flg":18},{"s":["^My realm needs a healer. I'd be honoured if it were you. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq106_lost_healer.0.g-1.46.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-5","flg":18},{"s":["^Come home with me. We have a fire that doesn't go out. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq106_lost_healer.0.g-1.47.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-6","flg":18},{"s":["^You were out here alone with a boar problem and a hymnbook. Come on. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-4":["ev",{"^->":"mq106_lost_healer.0.g-1.c-4.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.45.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.^.g-2"},{"#f":5}],"c-5":["ev",{"^->":"mq106_lost_healer.0.g-1.c-5.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.46.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.^.g-2"},{"#f":5}],"c-6":["ev",{"^->":"mq106_lost_healer.0.g-1.c-6.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.47.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.^.g-2"},{"#f":5}]}],"g-2":["^Linnea laughs, surprised at herself.","\n","^If you have a fire, you have people who get hurt near it. You'll need someone to mend them… if that's alright. ","#","^speaker:linnea","/#","\n","ev",true,"/ev",{"VAR=":"npc_linnea_recruited","re":true},"ev","str","^exposure","/str",-100,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^building:clinic","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","ev","str","^recipe:food_herb_tea","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^From now on, if something knocks you flat, you wake up in Linnea's care instead of a ditch. Upgrade! ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","done",null]}],null],"mq107_plans":["^Bram is drawing in the dirt with a stick when you wake. ","#","^scene:The Ashen Throne ","/#","#","^bg:day","/#","\n","^Three people and a flame can't sleep under a broken chair forever. We need a roof. A proper one. ","#","^speaker:bram","/#","\n","^A Longhouse. Long hall, big hearth, room for a table. Somewhere to stand when you want to sound important. ","#","^speaker:bram","/#","\n","^It'll cost us. Eighty wood, fifty stone, and a hundred and fifty coins for nails and rope. Bring it and I'll have her up in two days. ","#","^speaker:bram","/#","\n","ev",true,"/ev",{"VAR=":"ch1_longhouse_planned","re":true},"ev","str","^building:longhouse","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^A Longhouse! That's the Throne's next tier, Majesty. From ruin to… slightly bigger ruin, with a roof! ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","done",null],"mq107_hob":[["^An old man in a straw hat is standing at the edge of your turnip field, leaning on a hoe, crying a little. ","#","^scene:Old Royal Fields ","/#","#","^bg:day","/#","\n","^Sorry. Sorry. I followed a light through the mist. Didn't think anyone lived out here any more. ","#","^speaker:hob","/#","\n","^Hob Furrow. I farm. Farmed. My farm's somewhere back there, under all that. ","#","^speaker:hob","/#","\n",["ev",{"^->":"mq107_hob.0.18.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^This realm could use a farmer. Stay. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq107_hob.0.19.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^Then farm here. You're welcome to stay. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq107_hob.0.20.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^Our turnips could use supervision. Stay. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"mq107_hob.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.18.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"mq107_hob.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.19.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"mq107_hob.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.20.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Stay? Just like that? ","#","^speaker:hob ","/#","#","^mood:surprised","/#","\n","^Well. My back's bad, but my hands are good. I'll earn my bread. ","#","^speaker:hob ","/#","#","^mood:smile","/#","\n","ev",true,"/ev",{"VAR=":"npc_hob_arrived","re":true},"ev","str","^Hob Furrow","/str","str","^Farmer","/str",{"x()":"add_settler","exArgs":2},"pop","/ev","\n","^Our first settler! Ordinary people choosing to follow you. That's how kingdoms start, Majesty. ","#","^speaker:flicker ","/#","#","^mood:proud","/#","\n","done",null]}],null],"mq107_founding":[["^The Longhouse stands at the foot of the Ashen Throne, its raw timber still smelling of sap. Bram slaps the doorframe like the flank of a horse. ","#","^scene:The Longhouse ","/#","#","^bg:day","/#","\n","^Solid. She'll outlast me. That's the idea. ","#","^speaker:bram","/#","\n","^Linnea has hung bundles of drying herbs from the rafters. Hob has put a jar of wildflowers on the new table. Nobody asked him to.","\n","^Every kingdom needs a name. Preferably not \"Mudhold\". ","#","^speaker:flicker","/#","\n","^Name your kingdom. ","#","^input:var_kingdom_name","/#","\n","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^. ","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^! Oh, say it again. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","^And a banner. Something people see from far away and think: home. ","#","^speaker:flicker","/#","\n","^Design your banner. ","#","^banner","/#","\n","^Everyone is looking at you, waiting for you to say something.","\n",["ev",{"^->":"mq107_founding.0.54.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^We're not much yet. But every great kingdom began with a roof, a fire, and people who stayed. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq107_founding.0.55.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^Thank you. All of you. I couldn't have done any of this alone. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq107_founding.0.56.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^Welcome to ","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^. Population: four, and a very small fire. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"mq107_founding.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.54.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n","^Bram grunts approval. Hob wipes his eyes on his hat.","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"mq107_founding.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.55.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n","^Linnea smiles into her sleeve. Bram pretends to have something in his eye.","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"mq107_founding.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.56.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n","^I heard that! ","#","^speaker:flicker ","/#","#","^mood:angry","/#","\n","^Hob laughs so hard he has to sit down.","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^To ","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^. ","#","^speaker:bram","/#","\n","^To ","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^. ","#","^speaker:linnea","/#","\n","^To the ","ev",{"VAR?":"var_title"},"out","/ev","^! ","#","^speaker:hob","/#","\n","^The Heartflame flares on its brazier. For a moment the Veil at the edge of the valley draws back, just a little, as if something has been decided.","\n","ev",1,"/ev",{"VAR=":"kingdom_rank","re":true},"ev",true,"/ev",{"VAR=":"ch1_founded","re":true},"ev","str","^day","/str",{"x()":"stat","exArgs":1},"/ev",{"VAR=":"ch1_founded_day","re":true},"\n","ev",true,"/ev",{"VAR=":"deed_rank_up","re":true},"ev","str","^ra","/str",5,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^rank:1","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^ is a Hamlet! New blueprints: Hut, Tent, Commons Field, Beacon Tower. And now settlers can find us. ","#","^speaker:flicker ","/#","#","^mood:proud","/#","\n","done",null]}],null],"mq110_granary":["^Hob walks you to a round stone building half-sunk in brambles at the edge of the Old Royal Fields. ","#","^scene:The Old Granary ","/#","#","^bg:day","/#","\n","^Royal granary, they say. Fed a whole town through winter, once. Walls are sound. Roof's gone. Floor's… odd. ","#","^speaker:hob","/#","\n","^Fix it and we'd have somewhere to keep real food. The Longhouse larder only holds twenty rations. ","#","^speaker:hob","/#","\n","^A Restoration Project! Bring the three bundles and the kingdom restores the rest. It's like shopping, but you pay in turnips. ","#","^speaker:flicker","/#","\n","ev",true,"/ev",{"VAR=":"ch1_granary_shown","re":true},"ev","str","^project:granary","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null],"mq110_stairs":["^The last beam goes up. The Granary has a roof again, and Hob has already started arguing with a Mossbun about where the turnips go. ","#","^scene:The Old Granary ","/#","#","^bg:day","/#","\n","^Then Bram lifts a rotten floorboard and goes very still.","\n","^Kid. Come and look at this. ","#","^speaker:bram","/#","\n","^Stone stairs spiral down into the dark. Cold air breathes up out of them, and with it a faint violet glow.","\n","^The Sunken Cellars. The old city had a whole world underneath it. Storerooms, tunnels, vaults. ","#","^speaker:flicker","/#","\n","^Something down there is humming. Like a song stuck in a wall. ","#","^speaker:flicker ","/#","#","^mood:worried","/#","\n","ev",true,"/ev",{"VAR=":"ch1_granary_restored","re":true},"ev",true,"/ev",{"VAR=":"world_cellars_open","re":true},"ev","str","^activity:dive","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^The deeper you go, the harder it gets. Every few floors there's a Waystone, so you won't have to start from the top. ","#","^speaker:flicker","/#","\n","done",null],"mq108_crowfeather":[["^A crash from the storeroom. Then Hob's voice, high and furious: \"Thieves!\" ","#","^scene:The Longhouse ","/#","#","^bg:night","/#","\n","^Three hooded shapes are running for the trees with sacks on their shoulders: a skinny one with a sling, a huge one carrying two sacks, and a small one carrying your only good pot.","\n","ev","str","^food","/str",-6,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^Give chase.","/str","/ev",{"*":".^.c-0","flg":20},{"c-0":["\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^You catch them at the edge of the light. The three stop and turn, but they aren't looking at you. They're looking past you. ","#","^scene:The Edge of the Light","/#","\n","^A young man drops out of an oak and lands between you and them. Black hair with one white streak. A cloak of crow feathers. Two knives.","\n","^Evening, Your Royal Muddiness. ","#","^speaker:rook ","/#","#","^mood:smug","/#","\n","^You're Rook. Everyone in the Vale knows you're Rook. ","#","^speaker:flicker ","/#","#","^mood:angry","/#","\n","^Magpie, Jackdaw, Finch: go. I'll dance with the ","ev",{"VAR?":"var_title"},"out","/ev","^. ","#","^speaker:rook","/#","\n","ev",true,"/ev",{"VAR=":"npc_rook_met","re":true},"^He comes at you fast and low.","\n","ev","str","^Parry.","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Sidestep.","/str","/ev",{"*":".^.c-2","flg":20},{"c-1":["\n","^Knife meets stick. The stick loses a chip. You don't.","\n",{"->":".^.^.^.g-1"},{"#f":5}],"c-2":["\n","^He cuts the air where you were, and grins like that was a compliment.","\n",{"->":".^.^.^.g-1"},{"#f":5}]}],"g-1":["^He feints left. Twice. The third time he means it.","\n","ev","str","^Read the feint and catch his wrist.","/str","/ev",{"*":".^.c-3","flg":20},"ev","str","^Whistle for the Emberkit.","/str",{"VAR?":"ch1_emberkit_pact"},"/ev",{"*":".^.c-4","flg":21},{"c-3":["\n","^You catch his wrist on the downswing. One knife spins away into the grass.","\n",{"->":".^.^.^.g-2"},{"#f":5}],"c-4":["\n","^A streak of orange fire hits Rook's ankle. He yelps and hops, and you sweep his feet out from under him.","\n",{"->":".^.^.^.g-2"},{"#f":5}]}],"g-2":["^Rook lands flat on his back in the wet grass, winded, with your stick at his throat.","\n","^At the treeline, the gang has stopped running. The big one, Jackdaw, has put the sacks down.","\n","^Go on, then. Crowns always finish it. ","#","^speaker:rook ","/#","#","^mood:defiant","/#","\n","ev",{"VAR?":"npc_linnea_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["\n","^They're hungry. Look at them. Mostly they're just hungry. ","#","^speaker:linnea","/#","\n",{"->":".^.^.^.16"},null]}],"nop","\n","ev",{"VAR?":"npc_bram_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["\n","^A thief steals twice, kid. Your call. It's always your call now. ","#","^speaker:bram","/#","\n",{"->":".^.^.^.22"},null]}],"nop","\n","^Flicker hovers close, and for once says nothing at all.","\n","ev","str","^Spare him.","/str","/ev",{"*":".^.c-5","flg":20},"ev","str","^Banish him.","/str","/ev",{"*":".^.c-6","flg":20},{"c-5":["\n",{"->":".^.^.^.^.spare"},{"#f":5}],"c-6":["\n",{"->":".^.^.^.^.banish"},{"#f":5}]}]}],{"spare":[["ev",true,"/ev",{"VAR=":"deed_spared_rook","re":true},"ev","str","^merciful","/str","/ev",{"VAR=":"kingdom_reputation","re":true},"^You lower the stick.","\n",["ev",{"^->":"mq108_crowfeather.spare.0.12.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^Get up. Nobody in ","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^ gets finished. Not even thieves. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq108_crowfeather.spare.0.13.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^Get up. You're hungry, aren't you? All of you. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq108_crowfeather.spare.0.14.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^Get up. You're getting mud on my nice grass. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"mq108_crowfeather.spare.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.12.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"mq108_crowfeather.spare.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.13.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"mq108_crowfeather.spare.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.14.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Rook doesn't move. He stares at you as if you've started speaking another language.","\n","^…Why? ","#","^speaker:rook","/#","\n",["ev",{"^->":"mq108_crowfeather.spare.0.g-0.7.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-3","flg":18},{"s":["^A kingdom with room only for good people is going to be very empty. ","#","^speaker:you","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq108_crowfeather.spare.0.g-0.8.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-4","flg":18},{"s":["^Because you stole food, not gold. ","#","^speaker:you","/#",{"->":"$r","var":true},null]}],{"c-3":["ev",{"^->":"mq108_crowfeather.spare.0.g-0.c-3.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.7.s"},[{"#n":"$r2"}],"\n",{"->":".^.^.^.g-1"},{"#f":5}],"c-4":["ev",{"^->":"mq108_crowfeather.spare.0.g-0.c-4.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.8.s"},[{"#n":"$r2"}],"\n",{"->":".^.^.^.g-1"},{"#f":5}]}],"g-1":["^He gets up slowly. Behind him the gang has crept closer: Magpie with her sling, Jackdaw with his sacks, little Finch with the pot.","\n","^You're mad. Fine. Mad I can work with. ","#","^speaker:rook","/#","\n","^Here's the deal, Majesty. My lot eat. Four mouths, seven days. Get twenty-eight rations into your granary inside a week, and we're yours. ","#","^speaker:rook","/#","\n","^Miss it and we walk. No hard feelings. Some hard feelings. ","#","^speaker:rook ","/#","#","^mood:smug","/#","\n","ev","str","^active","/str","/ev",{"VAR=":"npc_rook_trial","re":true},"ev","str","^food","/str",6,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^quest:rooks_trial","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^Twenty-eight rations, and our own people eat one each a day. We'll need fields, forage, and a proper granary. And fewer thieves. Oh, wait. ","#","^speaker:flicker","/#","\n","done",null]}],null],"banish":[["ev",true,"/ev",{"VAR=":"deed_banished_rook","re":true},"ev","str","^stern","/str","/ev",{"VAR=":"kingdom_reputation","re":true},["ev",{"^->":"mq108_crowfeather.banish.0.10.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^Take your gang and go. Come near my people again and I won't be this polite. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq108_crowfeather.banish.0.11.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^Go. Please. Find somewhere that can feed you, because we can't. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq108_crowfeather.banish.0.12.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^Leave the sacks. Take your knives. Don't come back. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"mq108_crowfeather.banish.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.10.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"mq108_crowfeather.banish.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.11.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"mq108_crowfeather.banish.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.12.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Rook gets up, collects his knife from the grass, and bows. It's almost not mocking.","\n","^Noted, Majesty. Sharp crown you've got. ","#","^speaker:rook","/#","\n","^The Crowfeather Gang melts into the Veil. Jackdaw leaves the sacks behind. Finch does not leave the pot.","\n","ev","str","^food","/str",4,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","^He'll be back. His kind always comes back. Hopefully with better manners. ","#","^speaker:flicker","/#","\n","ev","str","^quest:banished","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null]}],null]}],"mq109_trial_start":["^Rook is sitting on the Longhouse roof when you come out in the morning, eating one of your turnips. ","#","^scene:The Longhouse ","/#","#","^bg:dawn","/#","\n","^Clock's ticking, Majesty. Seven days. ","#","^speaker:rook","/#","\n","^Everyone here eats one ration a day from the stores, so every mouth counts twice. ","#","^speaker:hob","/#","\n","^And the Longhouse larder only holds twenty. For twenty-eight, you'll want the Old Granary fixed. ","#","^speaker:hob","/#","\n","^Fields, foraging, Mira's caravan, and a Commons Field for settlers to work. Food Stock, Majesty. It's the heartbeat of a kingdom. A very hungry heartbeat. ","#","^speaker:flicker","/#","\n","ev","str","^building:commons","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null],"mq109_join":[["^Rook is waiting outside the Granary at dawn, counting sacks, lips moving. ","#","^scene:The Granary ","/#","#","^bg:dawn","/#","\n","ev",{"VAR?":"npc_rook_trial"},"str","^active","/str","==","/ev",[{"->":".^.b","c":true},{"b":["\n","^Twenty-eight. Twenty-nine. Huh. You actually did it. Inside the week. ","#","^speaker:rook ","/#","#","^mood:surprised","/#","\n","ev","str","^rook","/str",100,{"x()":"add_hearts","exArgs":2},"pop","/ev","\n",{"->":".^.^.^.17"},null]}],[{"->":".^.b"},{"b":["\n","^Twenty-eight. Took you long enough. ","#","^speaker:rook","/#","\n","^He doesn't sound annoyed. He sounds like someone who expected to be let down, and wasn't. Quite.","\n",{"->":".^.^.^.17"},null]}],"nop","\n","^Magpie, Jackdaw and Finch stand behind him with everything they own in three small bundles. Finch still has your pot.","\n","^Alright. We're yours. Or… we're here. Let's say here. I don't kneel. ","#","^speaker:rook","/#","\n",["ev",{"^->":"mq109_join.0.26.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^Welcome to ","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^, Rook. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq109_join.0.27.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^Nobody's asking you to kneel. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq109_join.0.28.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^Finch can keep the pot. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"mq109_join.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.26.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n","^Don't make it sound official. …It's a bit official. Fine. ","#","^speaker:rook","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"mq109_join.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.27.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n","^Good. My knees are for running. ","#","^speaker:rook","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"mq109_join.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.28.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n","^Finch hugs the pot. Rook very nearly smiles.","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^They pitch three patched tents by the treeline without being asked. Rook climbs back onto the Longhouse roof and stays there, watching the Veil.","\n","ev",true,"/ev",{"VAR=":"npc_rook_recruited","re":true},"ev","str","^done","/str","/ev",{"VAR=":"npc_rook_trial","re":true},"ev","str","^Magpie","/str","str","^Slinger","/str",{"x()":"add_settler","exArgs":2},"pop","/ev","\n","ev","str","^Jackdaw","/str","str","^Brute","/str",{"x()":"add_settler","exArgs":2},"pop","/ev","\n","ev","str","^Finch","/str","str","^Cutpurse","/str",{"x()":"add_settler","exArgs":2},"pop","/ev","\n","ev","str","^building:scout_post","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^A scout! The Scout's Post means maps, bounties, and one day expeditions. And a very annoying lookout. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","done",null]}],null],"mq109_deadline":["^Rook finds you at breakfast. ","#","^scene:The Longhouse ","/#","#","^bg:dawn","/#","\n","^Week's up, Majesty. ","ev","str","^food","/str",{"x()":"stat","exArgs":1},"out","/ev","^ rations. Needed twenty-eight. ","#","^speaker:rook","/#","\n","^He shrugs, and doesn't leave.","\n","^Thing is, you fed us every day anyway. Nobody does that. We'll stick around till you get there. Don't make it weird. ","#","^speaker:rook","/#","\n","ev","str","^late","/str","/ev",{"VAR=":"npc_rook_trial","re":true},"done",null],"mq111_captive":[["^Floor three is quieter than the others. Too quiet. At the end of a flooded corridor, something has built a cage out of old iron and roots. ","#","^scene:Sunken Cellars · Floor 3 ","/#","#","^bg:cellar","/#","\n","^Inside, a tall young woman in a scorched leather apron is trying to pick the lock with a hairpin.","\n","^Oh! U-um. Hi. Are you… real? Sorry. That's a weird question. ","#","^speaker:tamsin ","/#","#","^mood:shy","/#","\n","^I'm Tamsin. I was a smith's apprentice. With the Dominion. They left in a hurry and I… wasn't in the hurry. ","#","^speaker:tamsin","/#","\n","ev",true,"/ev",{"VAR=":"npc_tamsin_found","re":true},"ev","str","^Smash the lock.","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Ask her how to open it.","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["\n","^You hit the lock. Your stick breaks. The lock does not.","\n","^Th-the hinge pin. It's copper. Soft. Hit it there, not— yes! There! ","#","^speaker:tamsin","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["\n","^How do I get you out? ","#","^speaker:you","/#","\n","^The hinge pin's copper. Soft. One good hit, right at the top. ","#","^speaker:tamsin","/#","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^You hit the hinge. The door swings open.","\n","^Tamsin climbs out, unfolds to her full height, and looks down at your stick-sword with deep professional pain.","\n","^Is that… your weapon? ","#","^speaker:tamsin","/#","\n","^If you bring me ten copper ore, I can build a forge. And make you a real sword. Not… that. ","#","^speaker:tamsin ","/#","#","^mood:determined","/#","\n","^You lead her up through the tunnels and back into the light.","\n","ev","str","^quest:tamsin_ore","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null]}],null],"tamsin_forge":[["^You pile ten chunks of copper ore at Tamsin's feet. She stares at them. ","#","^scene:The Longhouse ","/#","#","^bg:day","/#","\n","^Oh. Oh, these are good. Look at the grain on this one— ","#","^speaker:tamsin ","/#","#","^mood:happy","/#","\n","^She builds a forge out of river stones and Bram's spare bricks in a single afternoon, talking the whole time, not stammering once.","\n","^Bellows! Flux! Heat! Okay. Stand back. Further. Further than that. ","#","^speaker:tamsin","/#","\n","^The copper glows. The hammer rings. By evening she presses a short, bright sword into your hands, still warm.","\n","ev","str","^min_copper_ore","/str",-10,{"x()":"give","exArgs":2},"pop","/ev","\n","ev","str","^power","/str",1,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","^It's not a sword yet. It's… it's a promise of a sword. But it'll cut Hollowed. ","#","^speaker:tamsin ","/#","#","^mood:shy","/#","\n",["ev",{"^->":"tamsin_forge.0.51.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^A fine blade. The realm is in your debt. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"tamsin_forge.0.52.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^It's beautiful, Tamsin. Thank you. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"tamsin_forge.0.53.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^It's so much pointier than my stick. ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"tamsin_forge.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.51.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"tamsin_forge.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.52.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"tamsin_forge.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.53.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Tamsin goes red to the ears and hides behind the anvil.","\n","^C-can I stay? I'd need a smithy. And coal. And… people who don't leave in a hurry. ","#","^speaker:tamsin","/#","\n","ev",true,"/ev",{"VAR=":"npc_tamsin_recruited","re":true},"ev","str","^building:smithy","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^A blacksmith! Better tools, better weapons, and metal fittings for bigger buildings. Tamsin matters, Majesty. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","done",null]}],null],"mq112_ruinback":[["ev",{"VAR?":"ruinback_tries"},1,"+",{"VAR=":"ruinback_tries","re":true},"/ev","^The tenth floor opens into a vast drowned hall. In the middle of the black water sits a hill. ","#","^scene:Sunken Cellars · Floor 10 ","/#","#","^bg:cellar","/#","\n","^Then the hill opens one eye.","ev",{"VAR?":"ruinback_tries"},1,">","/ev",[{"->":".^.b","c":true},{"b":["^ It remembers you.",{"->":".^.^.^.21"},null]}],"nop","\n","^A tortoise the size of a house rises out of the water. On its shell stands a ruined stone tower, and at the top of the tower, something glints gold.","\n","^Ruinback. A Guardian. The Veil's got into it: see the mist in its eyes? ","#","^speaker:flicker ","/#","#","^mood:worried","/#","\n","^And up there… Majesty. That's a piece of the Regalia. I can feel it from here. ","#","^speaker:flicker","/#","\n","^Ruinback's head sweeps across the hall like a battering ram.","\n","ev","str","^Duck and strike at its foreleg.","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Run up its tail onto the shell.","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["ev","str","^power","/str",{"x()":"stat","exArgs":1},3,">=","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":".^.^.^.^.^.win"},{"->":".^.^.^.9"},null]}],"nop","\n","^Your blows skitter off stone-hard scales. Ruinback shrugs, and the wave off its shoulders throws you across the hall.","\n","ev",{"VAR?":"npc_linnea_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["^ You come to beside the Waystone with one of Linnea's poultices on your forehead and Flicker shouting at you.",{"->":".^.^.^.18"},null]}],[{"->":".^.b"},{"b":["^You come to beside the Waystone, soaked, with Flicker shouting at you.",{"->":".^.^.^.18"},null]}],"nop","\n","^We need a better blade, or more friends with teeth! Tamsin's forge, an Emberkit, anything! ","#","^speaker:flicker ","/#","#","^mood:angry","/#","\n","ev","str","^energy","/str",-100,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","done",null]}],{"win":["^Your ","ev",{"VAR?":"npc_tamsin_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["^copper blade",{"->":".^.^.^.6"},null]}],[{"->":".^.b"},{"b":["^blade",{"->":".^.^.^.6"},null]}],"nop","^ bites deep. Ruinback roars, and the Veil pours out of the wound like smoke.","\n","ev",{"VAR?":"ch1_emberkit_pact"},"/ev",[{"->":".^.b","c":true},{"b":["^ Your Emberkit darts in and sets the mist alight. For a moment the whole hall glows.",{"->":".^.^.^.13"},null]}],"nop","\n","ev",{"VAR?":"npc_linnea_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["^ Linnea's yarrow keeps the cold out of your bones just long enough.",{"->":".^.^.^.19"},null]}],"nop","\n","^Ruinback sinks to the floor of the hall, still breathing, eyes clouded violet.","\n","^Now, Majesty! Hold out your hand. Trust me! ","#","^speaker:flicker","/#","\n","^You hold out your hand. Flicker lands in your palm, and light pours out of you both: gold, warm, and very old.","\n","^The violet drains from Ruinback's eyes. What's left is an old, tired, enormous tortoise, blinking at you.","\n","^Purified. It's just… itself again. ","#","^speaker:flicker ","/#","#","^mood:amazed","/#","\n","^You climb the tower on its shell. At the top, in a nest of moss, lies a heavy gold ring with a sun on its face.","\n","^The Signet. ","#","^speaker:flicker ","/#","#","^mood:serious","/#","\n","^When you touch it, the world goes white.","\n","^A golden city at dawn. Towers and banners over a sea of people. A crown lowered onto your head. A voice, maybe yours: \"For the Halcyon Days.\" ","#","^style:memory","/#","\n","^Then it's gone, and you're standing on a tortoise in the dark, holding a ring.","\n","ev","str","^key_regalia_signet","/str",1,{"x()":"give","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"ch1_signet","re":true},"ev",true,"/ev",{"VAR=":"world_regalia_signet","re":true},"ev",true,"/ev",{"VAR=":"world_surges_active","re":true},"ev","str","^ra","/str",10,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^regalia:signet","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^I can Purify! I learned a thing! And I feel… taller. Emotionally. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","^Far above you, the mist shivers once. Nobody else seems to notice.","\n","done",null]}],"mq113_feast":[["ev",{"VAR?":"var_kingdom_name"},"out","/ev","^ holds its first feast in the Longhouse. Every lantern you own is lit. ","#","^scene:The Founding Feast ","/#","#","^bg:feast","/#","\n","^Hob roasts turnips six different ways. Bram has carved a new bench for the head of the table and is pretending he hasn't.","\n","ev",{"VAR?":"npc_rook_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["^ Rook sits on the rafters instead of the bench. Magpie is trying to teach Finch to juggle the good plates.",{"->":".^.^.^.18"},null]}],"nop","\n","ev",{"VAR?":"npc_tamsin_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["^ Tamsin has made everyone copper cups. Hers is the only one that doesn't leak.",{"->":".^.^.^.24"},null]}],"nop","\n","^Linnea has woven flowers along the whole length of the table.","\n",["ev","str","^Sit with Bram.","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Sit with Linnea.","/str",{"VAR?":"npc_linnea_recruited"},"/ev",{"*":".^.c-1","flg":21},"ev","str","^Climb up to Rook on the rafters.","/str",{"VAR?":"npc_rook_recruited"},"/ev",{"*":".^.c-2","flg":21},"ev","str","^Sit with Tamsin.","/str",{"VAR?":"npc_tamsin_recruited"},"/ev",{"*":".^.c-3","flg":21},"ev","str","^Sit with Hob.","/str","/ev",{"*":".^.c-4","flg":20},"ev","str","^Share a turnip with Flicker.","/str","/ev",{"*":".^.c-5","flg":20},"ev","str","^Stand and raise your cup.","/str","/ev",{"*":".^.c-6","flg":20},{"c-0":["\n","^Bram raps the new bench with his knuckles.","\n","^Carved it for the kid who's going to be a ","ev",{"VAR?":"var_title"},"out","/ev","^. Sit. It's not for looking at. ","#","^speaker:bram ","/#","#","^mood:smile","/#","\n","ev","str","^bram","/str",50,{"x()":"add_hearts","exArgs":2},"pop","/ev","\n",{"->":".^.^"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"deed_saved_linnea_on_birthday"},"/ev",[{"->":".^.b","c":true},{"b":["^ A week ago I was burning hymnbooks for warmth, on my birthday. Now look.",{"->":".^.^.^.6"},null]}],[{"->":".^.b"},{"b":["^Not long ago I was sleeping in ruins. Now look.",{"->":".^.^.^.6"},null]}],"nop","^ ","#","^speaker:linnea","/#","\n","^Thank you. For the fire. For all of it. ","#","^speaker:linnea ","/#","#","^mood:smile","/#","\n","ev","str","^linnea","/str",50,{"x()":"add_hearts","exArgs":2},"pop","/ev","\n",{"->":".^.^"},{"#f":5}],"c-2":["\n","^Best seat in the house. You can see who's stealing the bread. ","#","^speaker:rook ","/#","#","^mood:smug","/#","\n","^It's Finch. It's always Finch. …Thanks for this, Majesty. Don't tell anyone I said it. ","#","^speaker:rook","/#","\n","ev","str","^rook","/str",50,{"x()":"add_hearts","exArgs":2},"pop","/ev","\n",{"->":".^.^"},{"#f":5}],"c-3":["\n","^Th-this cup leaks. I'm so sorry. I'll make you a better one. I'll make you ten. ","#","^speaker:tamsin ","/#","#","^mood:shy","/#","\n","ev","str","^tamsin","/str",50,{"x()":"add_hearts","exArgs":2},"pop","/ev","\n",{"->":".^.^"},{"#f":5}],"c-4":["\n","^My wife would've liked you. She liked anyone who fed people. ","#","^speaker:hob ","/#","#","^mood:smile","/#","\n",{"->":".^.^"},{"#f":5}],"c-5":["\n","^Flicker eats the whole turnip, somehow, and burps a small blue flame.","\n","^Worth it. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n",{"->":".^.^"},{"#f":5}],"c-6":["\n",{"->":".^.^.^.^.toast"},{"#f":5}],"#n":"table"}],null],{"toast":[["^Everyone goes quiet.","\n",["ev",{"^->":"mq113_feast.toast.0.2.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-0","flg":18},{"s":["^To the people who stayed. Every crown is held up by many hands. ","#","^speaker:you ","/#","#","^tone:regal","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq113_feast.toast.0.3.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-1","flg":18},{"s":["^To all of you. You're the kingdom. I'm just the one with the hat. ","#","^speaker:you ","/#","#","^tone:warm","/#",{"->":"$r","var":true},null]}],["ev",{"^->":"mq113_feast.toast.0.4.$r1"},{"temp=":"$r"},"str",{"->":".^.s"},[{"#n":"$r1"}],"/str","/ev",{"*":".^.^.c-2","flg":18},{"s":["^To turnips! Our finest subjects! ","#","^speaker:you ","/#","#","^tone:wry","/#",{"->":"$r","var":true},null]}],{"c-0":["ev",{"^->":"mq113_feast.toast.0.c-0.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.2.s"},[{"#n":"$r2"}],"\n","ev","str","^regal","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-1":["ev",{"^->":"mq113_feast.toast.0.c-1.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.3.s"},[{"#n":"$r2"}],"\n","ev","str","^warm","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"c-2":["ev",{"^->":"mq113_feast.toast.0.c-2.$r2"},"/ev",{"temp=":"$r"},{"->":".^.^.4.s"},[{"#n":"$r2"}],"\n","ev","str","^wry","/str",{"f()":"tone"},"pop","/ev","\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^The cups clatter together. And in the quiet after the cheer, everyone hears it.","\n","^From the forest far to the north, voices are singing. Many voices, all on one note.","\n","^All that clings is torn. All that is held will bleed. ","#","^style:hymn","/#","\n","^Let go the hand, the name, the crown, the seed. ","#","^style:hymn","/#","\n","^Nobody moves. ","ev",{"VAR?":"npc_linnea_recruited"},"/ev",[{"->":".^.b","c":true},{"b":["^ Linnea's hand has found Bram's sleeve.",{"->":".^.^.^.19"},null]}],"nop","\n","^That's not a song. That's a warning. ","#","^speaker:linnea ","/#","#","^mood:scared","/#","\n","^I know that tune. I don't know how I know it. ","#","^speaker:flicker ","/#","#","^mood:serious","/#","\n","^The singing stops. Every lantern in the Longhouse flickers at once, then steadies.","\n","ev",true,"/ev",{"VAR=":"ch1_vs_complete","re":true},"ev","str","^day","/str",{"x()":"stat","exArgs":1},"/ev",{"VAR=":"ch1_vs_day","re":true},"\n","^To be continued… ","#","^vs_end","/#","\n","done",null]}],null]}],"sq114_cart":[["^At dusk a small figure comes running up the south road out of the mist, straight for your light: a boy of about eight, with a wooden spoon in his fist. ","#","^scene:The South Road ","/#","#","^bg:dusk","/#","\n","^Help! Mum's cart is stuck and the fog's doing the whispering thing! ","#","^speaker:pip","/#","\n","^Pip Fenn, you get back here this instant! ","#","^speaker:marigold","/#","\n","ev","str","^Follow Pip into the Veil.","/str","/ev",{"*":".^.c-0","flg":20},{"c-0":["\n",{"->":".^.^.g-0"},{"#f":5}],"g-0":["^Twenty steps into the mist, you find a cart sunk to its axles, and a woman with a marigold pinned in her hair pushing it with her whole body.","\n","^You're the one with the light? Good. Sweetheart, grab that wheel. Pip, lantern high. Higher. ","#","^speaker:marigold","/#","\n","ev",0,"/ev",{"temp=":"pushes"},["ev",{"VAR?":"pushes"},1,"+",{"temp=":"pushes","re":true},"/ev","ev","str","^Put your shoulder to the wheel.","/str","/ev",{"*":".^.c-1","flg":4},"ev","str","^Hold the lantern higher so the whispers back off.","/str","/ev",{"*":".^.c-2","flg":4},{"c-1":["\n","^The cart lurches forward an inch.","\n",{"->":".^.^.^.^.g-1"},null],"c-2":["\n","^The mist hisses away from the light. Pip grins up at you.","\n",{"->":".^.^.^.^.g-1"},null],"#n":"push"}],null],"g-1":["ev",{"VAR?":"pushes"},2,"<","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":".^.^.^.^.g-0.push"},{"->":".^.^.^.6"},null]}],"nop","\n","^With a sucking pop, the wheel comes free. You walk the cart home to ","ev",{"VAR?":"var_kingdom_name"},"out","/ev","^ with Pip chattering the whole way.","\n","^Marigold Fenn. Goldie, if you like me. That's Pip. He likes you already, which is annoying, because now I have to like you too. ","#","^speaker:marigold ","/#","#","^mood:smile","/#","\n","^She looks at your Longhouse, your fire, and your people eating cold turnips.","\n","^Oh, sweethearts. No. Build me a kitchen and nobody here eats cold turnip again. ","#","^speaker:marigold","/#","\n","ev",true,"/ev",{"VAR=":"npc_marigold_met","re":true},"ev","str","^building:kitchen","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","done",null]}],null],"sq114_kitchen":["^The kitchen's first fire is barely lit before Marigold has three pots going and Pip has been sent for water twice. ","#","^scene:The Kitchen ","/#","#","^bg:day","/#","\n","^Sit. Eat. Then you can go and save the world, sweetheart. ","#","^speaker:marigold ","/#","#","^mood:smile","/#","\n","^It is the best thing you have eaten in a thousand years. Possibly literally.","\n","ev",true,"/ev",{"VAR=":"npc_marigold_recruited","re":true},"ev","str","^Pip","/str","str","^Child","/str",{"x()":"add_settler","exArgs":2},"pop","/ev","\n","ev","str","^food","/str",10,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^building:tavern","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^A cook! Hot meals make happier people, and happier people bring more people. It's a very tasty kind of politics. ","#","^speaker:flicker ","/#","#","^mood:happy","/#","\n","done",null],"sq115_herd":["ev",{"VAR?":"npc_juniper_met"},"!","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":".^.^.^.meet"},{"->":".^.^.^.5"},null]}],"nop","\n","ev",{"VAR?":"herd_found"},8,">=","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":".^.^.^.boar"},{"->":".^.^.^.13"},null]}],"nop","\n","^Juniper waves both arms at you from across the meadow. ","#","^scene:Mossbun Meadow ","/#","#","^bg:day","/#","\n",{"->":".^.herd"},{"meet":["^A tiny woman with teal hair in two puffs is standing on a rock in the middle of the meadow, shouting. ","#","^scene:Mossbun Meadow ","/#","#","^bg:day","/#","\n","^Has anyone seen fourteen Mossbuns?! No, six! Eight? Eight missing! Oh no. Oh no no no. ","#","^speaker:juniper ","/#","#","^mood:scared","/#","\n","^She sees you, jumps off the rock, and grabs both your hands.","\n","^You're the one with the light! And a Mossbun! Hi, Mossbun! I'm Juniper. June. A boar came out of the mist, a Hollowed one, and my herd scattered everywhere. ","#","^speaker:juniper","/#","\n","^Help me round them up? Mossbuns trust people who smell of carrots. You smell a bit like carrots. ","#","^speaker:juniper","/#","\n","ev",true,"/ev",{"VAR=":"npc_juniper_met","re":true},"ev","str","^quest:herd","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n",{"->":".^.^.herd"},null],"herd":[["ev",0,"/ev",{"temp=":"found"},"ev",{"VAR?":"herd_found"},0,">","/ev",[{"->":".^.b","c":true},{"b":["^ ","ev",{"VAR?":"herd_found"},"out","/ev","^ of 8 found. Juniper is keeping count on her fingers, loudly.",{"->":".^.^.^.10"},null]}],"nop","\n","ev","str","^Crouch low and wait for them to come to you.","/str","/ev",{"*":".^.c-0","flg":4},"ev","str","^Rattle a Creature Treat.","/str","str","^sig_treat","/str",{"x()":"item","exArgs":1},0,">","/ev",{"*":".^.c-1","flg":5},"ev","str","^Chase them.","/str","/ev",{"*":".^.c-2","flg":4},{"c-0":["\n","ev",2,"/ev",{"temp=":"found","re":true},"^Two Mossbuns creep out of the clover and sit on your boots.","\n",{"->":".^.^.g-0"},null],"c-1":["\n","ev","str","^sig_treat","/str",-1,{"x()":"give","exArgs":2},"pop","/ev","\n","ev",4,"/ev",{"temp=":"found","re":true},"^Four Mossbuns appear from nowhere and form an orderly queue.","\n",{"->":".^.^.g-0"},null],"c-2":["\n","ev",1,"/ev",{"temp=":"found","re":true},"^You chase one Mossbun in a wide circle. It lets you catch it, out of pity.","\n",{"->":".^.^.g-0"},null],"g-0":["ev",{"VAR?":"herd_found"},{"VAR?":"found"},"+","/ev",{"VAR=":"herd_found","re":true},"ev",{"VAR?":"herd_found"},8,">=","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":"sq115_herd.boar"},{"->":".^.^.^.12"},null]}],"nop","\n","^That's ","ev",{"VAR?":"herd_found"},"out","/ev","^! The rest are hiding deeper in. Come back tomorrow? They're shy in the afternoons. And the mornings. ","#","^speaker:juniper","/#","\n","done",null]}],null],"boar":["^All eight. All fourteen! Oh, you beautiful fluffy idiots. ","#","^speaker:juniper ","/#","#","^mood:happy","/#","\n","^A grunt from the treeline. The Hollowed boar steps out, white-eyed, trailing mist.","\n","^Flicker, now! ","#","^speaker:you","/#","\n","^Flicker lands in your palm. Gold light pours out. The boar staggers, sneezes, and turns out to be an ordinary, embarrassed pig.","\n","ev","str","^ra","/str",3,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","^Juniper stares at the pig. Then at you.","\n","^You didn't hurt him. You fixed him. ","#","^speaker:juniper ","/#","#","^mood:surprised","/#","\n","^That's it. I'm coming with you. All of us are. Fourteen Mossbuns and one pig. You'll need a Den. A big one. ","#","^speaker:juniper ","/#","#","^mood:happy","/#","\n","ev",true,"/ev",{"VAR=":"npc_juniper_recruited","re":true},"ev","str","^familiars","/str",2,{"x()":"add_stat","exArgs":2},"pop","/ev","\n","ev","str","^building:den","/str",{"x()":"unlock","exArgs":1},"pop","/ev","\n","^A beast warden! Juniper will look after every familiar we ever meet. Including the pig, apparently. ","#","^speaker:flicker","/#","\n","done",null]}],"mq116_court":["^Word has gone round. On Sunday morning your people come to the Longhouse, all of them, and stand in a nervous line. ","#","^scene:Court Day · The Longhouse ","/#","#","^bg:day","/#","\n","^They want you to rule, Majesty. Properly. Court Day: they bring you their troubles, and you decide. ","#","^speaker:flicker ","/#","#","^mood:serious","/#","\n","^Bram has put the carved bench at the head of the room. It is very nearly a throne.","\n",{"->t->":"court_petitions"},{"->t->":"court_decree"},"^The last petitioner bows and goes. The Longhouse doors stand open, and the whole valley seems brighter.","\n","ev",2,"/ev",{"VAR=":"kingdom_rank","re":true},"ev",true,"/ev",{"VAR=":"court_held","re":true},"ev",true,"/ev",{"VAR=":"deed_rank_up","re":true},"ev","str","^ra","/str",10,{"x()":"
