[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noze"
version = "0.1.0"
description = "NOZE — personal creative asset bank (search free/open sources by vibe, keep what you find) + an automated short-form clipping studio run by a team of agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx[http2]>=0.27",
  "pillow>=10.0",
  "numpy>=1.24",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real visual "vibe" search (CLIP / SigLIP2 via ONNX, no PyTorch needed).
clip = ["fastembed>=0.4"]
# Cloud storage for the bank: Cloudflare R2, Backblaze B2, Wasabi, MinIO, AWS S3.
s3 = ["boto3>=1.28"]
# The clipping studio (noze agency): Claude as the team's brain.
agency = ["anthropic>=2.3"]
# Word-level transcripts for moment picking and captions (CPU is fine).
transcribe = ["faster-whisper>=1.1"]
# Optional speaker locator for 16:9 → 9:16 reframing.
faces = ["opencv-python-headless>=4.9,<5"]  # 5.x dropped the Haar face detector
dev = ["pytest>=8", "respx>=0.21", "anthropic>=2.3"]
all = ["fastembed>=0.4", "boto3>=1.28", "anthropic>=2.3"]

[project.scripts]
noze = "noze.cli:main"

[tool.setuptools.packages.find]
include = ["noze*"]

[tool.setuptools.package-data]
noze = ["web/*", "web/vendor/*", "agency/sop/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
